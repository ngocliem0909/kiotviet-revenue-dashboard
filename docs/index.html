<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>L&T Analytics - Báo Cáo Doanh Thu</title>
  <link rel="icon" type="image/png" href="app-icon.png">
  <link rel="apple-touch-icon" href="app-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="L&T Analytics">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: -webkit-fill-available;
      overflow: hidden;
      background: #f1f5f9;
      -webkit-text-size-adjust: 100%;
    }
    .wrapper {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      -webkit-overflow-scrolling: touch;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrapper" id="appWrapper">
    <iframe 
      id="appIframe"
      src="https://script.google.com/macros/s/AKfycbzBJ8SdazzihyeIomttMdgIgj3czv_I4xMt_K1Bw7Syc2Jdc7sU0wJRnjUbQvaKhyXs/exec" 
      allow="clipboard-read; clipboard-write"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    // Đồng bộ chiều cao viewport động chuẩn xác trên iOS Safari và Android
    function syncViewportHeight() {
      const h = (window.visualViewport && window.visualViewport.height) 
        ? window.visualViewport.height 
        : window.innerHeight;
      const wrap = document.getElementById("appWrapper");
      if (wrap) wrap.style.height = h + "px";
      document.body.style.height = h + "px";
      document.documentElement.style.height = h + "px";
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncViewportHeight);
      window.visualViewport.addEventListener("scroll", syncViewportHeight);
    }
    window.addEventListener("resize", syncViewportHeight);
    window.addEventListener("orientationchange", () => setTimeout(syncViewportHeight, 200));
    syncViewportHeight();
  </script>
</body>
</html>
